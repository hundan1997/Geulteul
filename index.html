<style>
:root{
  --paper:#FDFDFA;
  --ink:#20242A;
  --grid:#2F7A5E;          /* 원고지 초록 괘선 */
  --grid-soft:#BFD8CC;
  --grid-faint:#E4EFE9;
  --muted:#7C837C;
  --red:#C4453C;           /* 글자수 경고 */
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.65;
  min-height:100vh;
  /* 원고지 여백 괘선 */
  background-image:
    linear-gradient(to right, var(--grid-faint) 1px, transparent 1px);
  background-size:28px 100%;
  background-position:-1px 0;
}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 80px;background:var(--paper);
  border-left:1px solid var(--grid-soft);border-right:1px solid var(--grid-soft);min-height:100vh}

/* ── 헤더: 원고지 칸에 담긴 제목 ── */
header{margin-bottom:6px}
.manuscript-title{display:inline-flex;border:1.5px solid var(--grid);border-radius:2px;overflow:hidden}
.manuscript-title span{
  font-family:var(--serif);font-weight:700;font-size:26px;line-height:1;
  width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--grid);color:var(--grid)}
.manuscript-title span:last-child{border-right:none}
.tagline{font-size:13px;color:var(--muted);margin-top:10px;letter-spacing:.02em}

/* ── 단계 표시 ── */
.steps{display:flex;gap:6px;align-items:center;margin:26px 0 18px;font-size:12px;color:var(--muted)}
.steps b{color:var(--grid);font-weight:600}
.steps .bar{flex:1;height:1px;background:var(--grid-soft)}

/* ── 카드 선택 ── */
.section-label{
  font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);
  margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
.section-label::before{content:"";width:10px;height:10px;border:1.5px solid var(--grid);display:inline-block;transform:translateY(1px)}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{
  text-align:left;background:#fff;border:1px solid var(--grid-soft);border-radius:6px;
  padding:16px 15px;cursor:pointer;font-family:var(--sans);color:var(--ink);
  transition:border-color .15s, box-shadow .15s}
.choice:hover{border-color:var(--grid)}
.choice:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
.choice.selected{border-color:var(--grid);box-shadow:inset 0 0 0 1px var(--grid)}
.choice .t{font-weight:700;font-size:15px;display:block;margin-bottom:3px}
.choice .d{font-size:12.5px;color:var(--muted);display:block;line-height:1.5}
.choice-grid.topics{grid-template-columns:1fr 1fr}
@media(max-width:420px){.choice-grid.topics{grid-template-columns:1fr}}

/* ── 입력 블록 ── */
.block{background:#fff;border:1px solid var(--grid-soft);border-radius:6px;margin-bottom:12px;overflow:hidden}
.block-head{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.block-no{
  font-family:var(--serif);font-size:12px;color:var(--grid);border:1px solid var(--grid);
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:2px}
.block-title{font-weight:700;font-size:14px;flex:1}
.block-title .opt{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:5px}
.block-ctrl{display:flex;gap:2px}
.block-ctrl button{
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;
  width:26px;height:26px;border-radius:4px;line-height:1}
.block-ctrl button:hover{background:var(--grid-faint);color:var(--grid)}
.block-guide{font-size:12.5px;color:var(--muted);padding:2px 12px 8px;line-height:1.5}
.block textarea{
  width:100%;border:none;border-top:1px dashed var(--grid-soft);resize:none;
  font-family:var(--sans);font-size:15px;line-height:1.7;padding:11px 12px;
  color:var(--ink);background:transparent;min-height:52px;display:block}
.block textarea:focus{outline:none;background:#FBFDFC}
.block textarea::placeholder{color:#B9BFB9}
.add-block{
  width:100%;background:none;border:1px dashed var(--grid-soft);border-radius:6px;
  color:var(--muted);font-size:13px;padding:11px;cursor:pointer;font-family:var(--sans)}
.add-block:hover{border-color:var(--grid);color:var(--grid)}

/* ── 옵션/버튼 ── */
.opts{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0;font-size:13px;color:var(--ink)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--grid)}
.btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:14.5px;font-weight:600;border-radius:6px;cursor:pointer;
  padding:12px 20px;border:1px solid var(--grid);transition:opacity .15s}
.btn.primary{background:var(--grid);color:#fff;flex:1;min-width:150px}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:none;color:var(--grid)}
.btn.ghost:hover{background:var(--grid-faint)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── 완성본 ── */
.result-meta{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px;font-size:12.5px;color:var(--muted)}
.count.over{color:var(--red);font-weight:700}
#resultText{
  width:100%;border:1.5px solid var(--grid);border-radius:6px;background:#fff;
  font-family:var(--serif);font-size:15.5px;line-height:1.9;padding:18px 16px;
  color:var(--ink);resize:vertical;min-height:220px}
#resultText:focus{outline:none;box-shadow:0 0 0 2px var(--grid-faint)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="manuscript-title" aria-label="글틀">
    <span>글</span><span>틀</span>
  </div>
  <p class="tagline">떠오르는 대로 적으면, 순서는 틀이 잡아줍니다.</p>
</header>

<div class="steps" id="stepBar">
  <b id="stepLabel">1. 형식 선택</b><span class="bar"></span><span id="stepHint">장문 / 단문</span>
</div>

<!-- STEP 1: 형식 -->
<section id="step1">
  <p class="section-label">어떤 글을 쓸까요?</p>
  <div class="choice-grid">
    <button class="choice" data-format="long">
      <span class="t">장문 · 블로그</span>
      <span class="d">특정 주제를 자세히. 네이버 블로그 포스트에 알맞은 구성</span>
    </button>
    <button class="choice" data-format="short">
      <span class="t">단문 · X 포스트</span>
      <span class="d">떠오른 생각을 빠르게. 글자수 카운터 포함</span>
    </button>
  </div>
</section>

<!-- STEP 2: 주제 -->
<section id="step2" class="hidden">
  <p class="section-label">무엇에 대한 글인가요?</p>
  <div class="choice-grid topics" id="topicGrid"></div>
</section>

<!-- STEP 3: 입력 -->
<section id="step3" class="hidden">
  <p class="section-label" id="inputLabel">순서대로 채워보세요</p>
  <div id="blocks"></div>
  <button class="add-block" id="addBlock">＋ 자유 블록 추가</button>
  <div class="opts" id="longOpts">
    <label><input type="checkbox" id="optHeadings" checked> 소제목 넣기</label>
    <label><input type="checkbox" id="optDivider"> 문단 사이 구분선(―)</label>
  </div>
  <div class="btn-row">
    <button class="btn ghost" id="backBtn">← 주제 다시 선택</button>
    <button class="btn primary" id="composeBtn">글 완성하기</button>
  </div>
</section>

<!-- STEP 4: 완성 -->
<section id="step4" class="hidden">
  <p class="section-label">완성본 <span style="font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted)">— 여기서 바로 고쳐도 돼요</span></p>
  <div class="result-meta">
    <span id="resultKind"></span>
    <span class="count" id="charCount"></span>
  </div>
  <textarea id="resultText" spellcheck="false"></textarea>
  <div class="btn-row">
    <button class="btn ghost" id="editBtn">← 내용 수정</button>
    <button class="btn ghost" id="newBtn">새 글</button>
    <button class="btn primary" id="copyBtn">전체 복사</button>
  </div>
</section>

</div>
<div class="toast" id="toast">복사됐어요</div>

/* ───────────── 상태 ───────────── */
let state = { format:null, topic:null, blocks:[] };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const step1=$('step1'), step2=$('step2'), step3=$('step3'), step4=$('step4');

function setStep(n, hint){
  $('stepLabel').textContent = n;
  $('stepHint').textContent = hint;
}

/* STEP 1 */
document.querySelectorAll('#step1 .choice').forEach(btn=>{
  btn.addEventListener('click',()=>{
    state.format = btn.dataset.format;
    document.querySelectorAll('#step1 .choice').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    renderTopics();
    step2.classList.remove('hidden');
    step3.classList.add('hidden'); step4.classList.add('hidden');
    setStep('2. 주제 선택', state.format==='long'?'장문 · 블로그':'단문 · X');
    step2.scrollIntoView({behavior:'smooth',block:'start'});
  });
});

/* STEP 2 */
function renderTopics(){
  const grid = $('topicGrid');
  grid.innerHTML='';
  TOPICS.forEach(t=>{
    const b=document.createElement('button');
    b.className='choice';
    b.innerHTML=`<span class="t">${t.name}</span><span class="d">${t.d}</span>`;
    b.addEventListener('click',()=>{
      state.topic=t.id;
      grid.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      initBlocks();
    });
    grid.appendChild(b);
  });
}

/* STEP 3 */
function initBlocks(){
  const tpl = T[state.format][state.topic];
  state.blocks = tpl.map(x=>({...x, value:''}));
  renderBlocks();
  $('longOpts').style.display = state.format==='long' ? 'flex' : 'none';
  step3.classList.remove('hidden'); step4.classList.add('hidden');
  const tName = TOPICS.find(t=>t.id===state.topic).name;
  setStep('3. 내용 입력', tName);
  $('inputLabel').textContent = `${tName} — 순서대로 채워보세요`;
  step3.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderBlocks(){
  const wrap = $('blocks');
  const values = {};
  wrap.querySelectorAll('textarea').forEach(t=>values[t.dataset.i]=t.value); // 보존
  wrap.innerHTML='';
  state.blocks.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='block';
    el.innerHTML=`
      <div class="block-head">
        <span class="block-no">${i+1}</span>
        <span class="block-title">${b.title}${b.opt?'<span class="opt">건너뛰어도 돼요</span>':''}</span>
        <span class="block-ctrl">
          <button title="위로" aria-label="위로 이동" data-act="up" data-i="${i}">▲</button>
          <button title="아래로" aria-label="아래로 이동" data-act="down" data-i="${i}">▼</button>
          <button title="삭제" aria-label="블록 삭제" data-act="del" data-i="${i}">✕</button>
        </span>
      </div>
      <p class="block-guide">${b.guide}</p>
      <textarea data-i="${i}" placeholder="${esc(b.ph||'')}" rows="2"></textarea>`;
    wrap.appendChild(el);
    const ta = el.querySelector('textarea');
    ta.value = b.value;
    autoGrow(ta);
    ta.addEventListener('input',e=>{
      state.blocks[i].value = e.target.value;
      autoGrow(e.target);
    });
  });
  wrap.querySelectorAll('.block-ctrl button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.i, act=btn.dataset.act;
      if(act==='up' && i>0){ [state.blocks[i-1],state.blocks[i]]=[state.blocks[i],state.blocks[i-1]]; }
      if(act==='down' && i<state.blocks.length-1){ [state.blocks[i+1],state.blocks[i]]=[state.blocks[i],state.blocks[i+1]]; }
      if(act==='del'){ if(state.blocks.length<=1) return; if(state.blocks[i].value && !confirm('내용이 있는 블록입니다. 삭제할까요?')) return; state.blocks.splice(i,1); }
      renderBlocks();
    });
  });
}

function autoGrow(ta){
  ta.style.height='auto';
  ta.style.height=(ta.scrollHeight+2)+'px';
}

$('addBlock').addEventListener('click',()=>{
  state.blocks.push({title:'자유 블록', guide:'원하는 내용을 자유롭게. ▲▼로 위치를 옮기세요.', ph:'내용…', value:'', opt:true, free:true});
  renderBlocks();
  const tas=$('blocks').querySelectorAll('textarea');
  tas[tas.length-1].focus();
});

$('backBtn').addEventListener('click',()=>{
  step3.classList.add('hidden');
  setStep('2. 주제 선택', state.format==='long'?'장문 · 블로그':'단문 · X');
  step2.scrollIntoView({behavior:'smooth'});
});

/* STEP 4: 조립 */
$('composeBtn').addEventListener('click',()=>{
  const filled = state.blocks.filter(b=>b.value.trim());
  if(!filled.length){ alert('아직 입력된 내용이 없어요. 한 칸이라도 채워주세요!'); return; }
  $('resultText').value = compose();
  $('resultKind').textContent = (state.format==='long'?'장문 · 블로그':'단문 · X 포스트')
      + ' · ' + TOPICS.find(t=>t.id===state.topic).name;
  updateCount();
  step4.classList.remove('hidden');
  setStep('4. 완성', '복사해서 붙여넣기');
  step4.scrollIntoView({behavior:'smooth',block:'start'});
});

function compose(){
  const blocks = state.blocks.filter(b=>b.value.trim());
  if(state.format==='short'){
    return blocks.map(b=>b.value.trim()).join('\n\n');
  }
  // 장문
  const useHead = $('optHeadings').checked;
  const useDiv  = $('optDivider').checked;
  const parts=[];
  blocks.forEach((b,idx)=>{
    const isTitle = b.heading===null && idx===0; // 첫 블록이 제목형이면
    const text = b.value.trim();
    if(isTitle){ parts.push(text); return; }
    let seg='';
    if(useHead && !b.free) seg += `■ ${b.title}\n\n`;
    seg += text;
    parts.push(seg);
  });
  const sep = useDiv ? '\n\n―\n\n' : '\n\n\n';
  // 제목과 본문 사이는 항상 여백 크게
  if(blocks.length>1 && blocks[0].heading===null){
    return parts[0] + '\n\n\n' + parts.slice(1).join(sep);
  }
  return parts.join(sep);
}

/* X 글자수: CJK·전각 2, 그 외 1 (가중치 280 기준) */
function xWeight(str){
  let w=0;
  for(const ch of str){
    const c=ch.codePointAt(0);
    const wide = (c>=0x1100&&c<=0x115F)||(c>=0x2E80&&c<=0xA4CF)||(c>=0xAC00&&c<=0xD7A3)
      ||(c>=0xF900&&c<=0xFAFF)||(c>=0xFE30&&c<=0xFE4F)||(c>=0xFF00&&c<=0xFF60)||(c>=0xFFE0&&c<=0xFFE6);
    w += wide?2:1;
  }
  return w;
}
function updateCount(){
  const v=$('resultText').value;
  const el=$('charCount');
  if(state.format==='short'){
    const w=xWeight(v);
    el.textContent=`X 가중치 ${w} / 280 (공백 포함 ${v.length}자)`;
    el.classList.toggle('over', w>280);
  }else{
    el.textContent=`공백 포함 ${v.length.toLocaleString()}자`;
    el.classList.remove('over');
  }
}
$('resultText').addEventListener('input',updateCount);

$('editBtn').addEventListener('click',()=>{
  step4.classList.add('hidden');
  setStep('3. 내용 입력', TOPICS.find(t=>t.id===state.topic).name);
  step3.scrollIntoView({behavior:'smooth'});
});

$('newBtn').addEventListener('click',()=>{
  if(state.blocks.some(b=>b.value.trim()) && !confirm('작성 중인 내용이 사라져요. 새 글을 시작할까요?')) return;
  state={format:null,topic:null,blocks:[]};
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
  step2.classList.add('hidden');step3.classList.add('hidden');step4.classList.add('hidden');
  setStep('1. 형식 선택','장문 / 단문');
  window.scrollTo({top:0,behavior:'smooth'});
});

/* 복사 */
$('copyBtn').addEventListener('click',async()=>{
  const txt=$('resultText').value;
  try{
    await navigator.clipboard.writeText(txt);
    showToast();
  }catch(e){
    const ta=$('resultText'); ta.select(); document.execCommand('copy'); showToast();
  }
});
function showToast(){
  const t=$('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
</script>
